      <stop offset="0" stop-color="#617e9f"/><stop offset="1" stop-color="#516c8e"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="402" x2="0" y2="865" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ebeae8"/><stop offset=".8" stop-color="#e2e2e2"/><stop offset="1" stop-color="#c6cacf"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#405369"/><stop offset="1" stop-color="#3a4b5f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="678" x2="0" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6dade"/><stop offset="1" stop-color="#bfcad5"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="866" x2="0" y2="926" gradientUnits="userSpaceOnUse">
