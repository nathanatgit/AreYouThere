# 推送 v* 标签（如 v0.1.0）时自动构建并发布 GitHub Release。
#
# 产物：
#   x86 / x64：MSI 安装包、单文件便携版 exe、zip（文件夹版）
#   msixbundle：x86 + x64 + arm64（ARM64 只通过 MSIX 发布）
#
# 可选签名（不配置也能发布，但未签名的 MSIX 无法安装）：
#   Secrets  SIGNING_CERT_BASE64   .pfx 证书的 base64
#            SIGNING_CERT_PASSWORD .pfx 密码
#   Variable MSIX_PUBLISHER        与证书主题完全一致，例如 CN=HGY
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，例如 0.1.0）；会创建对应的 v 标签'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  WIX_VERSION: 5.0.2

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86
            kinds: zip,portable,msi,msix
          - arch: x64
            kinds: zip,portable,msi,msix
          - arch: arm64
            kinds: msix
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "无效版本号：$v（标签应为 vX.Y.Z）" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Install WiX
        if: contains(matrix.kinds, 'msi')
        run: dotnet tool install --global wix --version ${{ env.WIX_VERSION }}

      - name: Prepare signing certificate
        id: cert
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        run: |
          if ($env:CERT_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT_BASE64))
            "path=$path" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host '未配置签名证书，产物将不签名。'
          }

      - name: Build
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=HGY' }}
        run: |
          $params = @{
            Version   = '${{ steps.version.outputs.value }}'
            Arch      = '${{ matrix.arch }}'
            Kinds     = '${{ matrix.kinds }}' -split ','
            OutDir    = 'out'
            Publisher = $env:PUBLISHER
          }
          if ('${{ steps.cert.outputs.path }}') { $params.CertPath = '${{ steps.cert.outputs.path }}'; $params.CertPassword = $env:CERT_PASSWORD }
          ./build/build-release.ps1 @params

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            out/*.zip
            out/*.msi
            out/*-portable.exe
            out/msix/*.msix

  release:
    name: Bundle & publish
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          "value=$v" >> $env:GITHUB_OUTPUT

      # makeappx 来自项目引用的 Microsoft.Windows.SDK.BuildTools 包
      - name: Restore build tools
        run: dotnet restore AreYouThere/AreYouThere.csproj

      - name: Prepare signing certificate
        id: cert
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        run: |
          if ($env:CERT_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT_BASE64))
            "path=$path" >> $env:GITHUB_OUTPUT
          }

      - name: Create msixbundle
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $params = @{ Version = '${{ steps.version.outputs.value }}'; Bundle = $true; OutDir = 'out' }
          if ('${{ steps.cert.outputs.path }}') { $params.CertPath = '${{ steps.cert.outputs.path }}'; $params.CertPassword = $env:CERT_PASSWORD }
          ./build/build-release.ps1 @params

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.cert.outputs.path != '' }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          $files = @(Get-ChildItem out -File | Where-Object { $_.Extension -in '.zip', '.msi', '.exe', '.msixbundle' } | ForEach-Object FullName)
          $signNote = if ($env:SIGNED -eq 'true') { '' } else { "`n> ⚠️ 本版本未签名：Windows 可能提示“未知发布者”；msixbundle 需要签名后才能安装。`n" }
          $notes = @"
          ## 下载哪个？

          | 文件 | 说明 |
          |---|---|
          | ``AreYouThere-$v-win-x64.msi`` | **推荐**：安装版（64 位），带开始菜单快捷方式，可在“应用”中卸载 |
          | ``AreYouThere-$v-win-x86.msi`` | 安装版（32 位系统） |
          | ``AreYouThere-$v-win-x64-portable.exe`` | 便携版：单个 exe，下载即用，不需要安装 |
          | ``AreYouThere-$v-win-x86-portable.exe`` | 便携版（32 位系统） |
          | ``AreYouThere-$v-win-x64.zip`` / ``win-x86.zip`` | 文件夹版：解压后运行 ``AreYouThere.exe`` |
          | ``AreYouThere-$v.msixbundle`` | MSIX 包，含 x86 / x64 / **ARM64**（ARM 设备请用这个） |
          $signNote
          「在吗」完全离线运行，不联网、不上传任何数据。需要 Windows 10 1809 或更高版本。
          "@
          gh release create "v$v" @files --title "在吗 AreYouThere v$v" --notes $notes --generate-notes --target '${{ github.sha }}'
