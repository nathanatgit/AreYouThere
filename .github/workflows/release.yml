# 推送 v* 标签（如 v0.1.0）时自动构建并发布 GitHub Release。
#
# 产物：
#   x86 / x64：MSI 安装包、单文件便携版 exe、zip（文件夹版）
#   msixbundle：x86 + x64 + arm64（ARM64 只通过 MSIX 发布）
#
# MSIX 身份（Settings › Secrets and variables › Actions › Variables）。上架 Microsoft Store 时
# 填 Partner Center“产品标识”页面上的值，商店会负责签名，见 docs/microsoft-store.md：
#   MSIX_IDENTITY_NAME            Package/Identity/Name，例如 12345HGY.AreYouThere
#   MSIX_PUBLISHER                Package/Identity/Publisher，例如 CN=XXXXXXXX-XXXX-...
#   MSIX_PUBLISHER_DISPLAY_NAME   Package/Properties/PublisherDisplayName
#
# 可选的自有证书签名（不配置也能发布；exe/msi 会提示“未知发布者”）：
#   Secrets  SIGNING_CERT_BASE64   .pfx 证书的 base64
#            SIGNING_CERT_PASSWORD .pfx 密码（此时 MSIX_PUBLISHER 必须与证书主题一致）
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，例如 0.1.0）；会创建对应的 v 标签'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  WIX_VERSION: 5.0.2

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86
            kinds: zip,portable,msi,msix
          - arch: x64
            kinds: zip,portable,msi,msix
          - arch: arm64
            kinds: msix
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "无效版本号：$v（标签应为 vX.Y.Z）" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Install WiX
        if: contains(matrix.kinds, 'msi')
        run: dotnet tool install --global wix --version ${{ env.WIX_VERSION }}

      - name: Prepare signing certificate
        id: cert
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        run: |
          if ($env:CERT_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT_BASE64))
            "path=$path" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host '未配置签名证书，产物将不签名。'
          }

      - name: Build
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=65060FB2-9417-4C15-9ABF-D5188EB4DF3A' }}
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'NathanHan.AreYouThere' }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'NathanHan' }}
        run: |
          $params = @{
            Version              = '${{ steps.version.outputs.value }}'
            Arch                 = '${{ matrix.arch }}'
            Kinds                = '${{ matrix.kinds }}' -split ','
            OutDir               = 'out'
            Publisher            = $env:PUBLISHER
            IdentityName         = $env:IDENTITY_NAME
            PublisherDisplayName = $env:PUBLISHER_DISPLAY_NAME
          }
          if ('${{ steps.cert.outputs.path }}') { $params.CertPath = '${{ steps.cert.outputs.path }}'; $params.CertPassword = $env:CERT_PASSWORD }
          ./build/build-release.ps1 @params

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            out/*.zip
            out/*.msi
            out/*-portable.exe
            out/msix/*.msix

  release:
    name: Bundle & publish
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          "value=$v" >> $env:GITHUB_OUTPUT

      # makeappx 来自项目引用的 Microsoft.Windows.SDK.BuildTools 包
      - name: Restore build tools
        run: dotnet restore AreYouThere/AreYouThere.csproj

      - name: Prepare signing certificate
        id: cert
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        run: |
          if ($env:CERT_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT_BASE64))
            "path=$path" >> $env:GITHUB_OUTPUT
          }

      - name: Create msixbundle
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $params = @{ Version = '${{ steps.version.outputs.value }}'; Bundle = $true; OutDir = 'out' }
          if ('${{ steps.cert.outputs.path }}') { $params.CertPath = '${{ steps.cert.outputs.path }}'; $params.CertPassword = $env:CERT_PASSWORD }
          ./build/build-release.ps1 @params

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.cert.outputs.path != '' }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          $files = @(Get-ChildItem out -File | Where-Object { $_.Extension -in '.zip', '.msi', '.exe', '.msixbundle' } | ForEach-Object FullName)
          # 说明文字放在 build/release-notes.md：中文弯引号写在 pwsh 字符串里会被当成引号而导致解析失败
          $notes = [IO.File]::ReadAllText('build/release-notes.md').Replace('{VERSION}', $v)
          $notes = if ($env:SIGNED -eq 'true') { $notes -replace '(?s)<!-- unsigned -->.*?<!-- /unsigned -->\r?\n?', '' } else { $notes -replace '<!-- /?unsigned -->\r?\n?', '' }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesFile, $notes, [Text.UTF8Encoding]::new($false))
          gh release create "v$v" @files --title "在吗 AreYouThere v$v" --notes-file $notesFile --generate-notes --target '${{ github.sha }}'
